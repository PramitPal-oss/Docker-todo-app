services:
  db:
    image: postgres:18
    container_name: postgres18
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secret123
      POSTGRES_DB: todo_app
    # ports:
    #   - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U admin -d todo_app']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - app-network

  # One-shot schema migration. Runs to completion before the API starts.
  # schema.sql is idempotent (CREATE ... IF NOT EXISTS), so this is safe on
  # every `up`.
  migrate:
    build: ./backend
    env_file:
      - ./backend/.env
    command: npm run db:init
    restart: 'no'
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network

  backend:
    build: ./backend
    # ports:
    #   - '5000:5000'
    volumes:
      - ./backend/logs:/app/logs
    env_file:
      - ./backend/.env
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - app-network

  frontend:
    build: ./frontend
    env_file:
      - ./frontend/.env
    depends_on:
      - backend
    networks:
      - app-network

volumes:
  pgdata:

networks:
  app-network:
