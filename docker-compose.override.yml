services:
  db:
    ports:
      - '5432:5432'

  # In dev there is no compiled dist/, so run the schema through ts-node.
  migrate:
    build:
      target: development
    volumes:
      - ./backend:/app
      - /app/node_modules
    command: npm run db:init:dev

  backend:
    build:
      target: development
    ports:
      - '5000:5000'
    volumes:
      - ./backend:/app
      - /app/node_modules
    command: npm run dev

  frontend:
    build:
      target: development
    ports:
      - '5173:5173'
    volumes:
      - ./frontend:/app
      - /app/node_modules
    stdin_open: true
    tty: true
    command: npm run dev -- --host
